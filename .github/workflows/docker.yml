name: Deploy to docker hub

# Настройка триггеров запуска
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master


jobs:
  build:
    environment: test
    runs-on: ubuntu-latest    
    steps:
#скачиваем    
      - uses: actions/checkout@main      
      - name: Login to docker hub
        if: success()
        uses: actions-hub/docker/login@master
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_LOGIN }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}

      - name: Build image
        if: success()
        run: docker build -t ${{ vars.DOCKER_LOGIN }}/testapp:${{ github.sha }} ./Backend/

      - name: Push to docker registry
        if: success()
        uses: actions-hub/docker@master
        with:
          args: push ${{ vars.DOCKER_LOGIN }}/testapp:${{ github.sha }}
  

      
